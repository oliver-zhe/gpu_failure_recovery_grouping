[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oliver-zhe-gpu_failure_recovery_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出推理网关架构师·GPU 故障与作业自愈上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "oliver-zhe" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://oliver-zhe.github.io"
Repository = "https://github.com/oliver-zhe/gpu_failure_recovery_grouping"
Issues = "https://github.com/oliver-zhe/gpu_failure_recovery_grouping/issues"

[project.scripts]
gpu_failure_recovery_grouping = "gpu_failure_recovery_grouping:main"

[tool.setuptools]
py-modules = ["gpu_failure_recovery_grouping"]
